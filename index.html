<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOSS KARAOKE RESTAURANT</title>
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #121212;
            --card-hover: #181818;
            --accent-gold: #c5a059;
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            --text-main: #ffffff;
            --text-muted: #8a8a8f;
            --border-color: #222224;
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 24px 16px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            background-image: radial-gradient(circle at top, #1c1710 0%, var(--bg-color) 70%);
            background-attachment: fixed;
        }
        
        .container { width: 100%; max-width: 550px; }
        
        header { 
            text-align: center; 
            margin-bottom: 30px; 
            position: relative;
        }
        
        header h1 { 
            font-size: 36px; 
            font-weight: 300;
            color: var(--text-main); 
            text-transform: uppercase; 
            letter-spacing: 6px; 
            margin-bottom: 6px;
            background: linear-gradient(to right, #fff 20%, #c5a059 50%, #fff 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 4s linear infinite;
        }
        
        header p { 
            color: var(--accent-gold); 
            font-size: 11px; 
            font-weight: 600;
            text-transform: uppercase; 
            letter-spacing: 2px; 
            opacity: 0.8;
        }
        
        @keyframes shine {
            to { background-position: 200% center; }
        }

        .status-msg { 
            text-align: center; 
            color: var(--accent-gold); 
            margin-bottom: 20px; 
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        .search-container { margin-bottom: 24px; position: relative; }
        
        .search-box { 
            width: 100%; 
            padding: 16px 20px; 
            background-color: rgba(18, 18, 18, 0.8); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            color: var(--text-main); 
            font-size: 16px; 
            outline: none; 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.05);
        }
        
        .search-box:focus { 
            border-color: var(--accent-gold); 
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.15), inset 0 1px 1px rgba(255,255,255,0.05);
            background-color: #141414;
        }
        
        .categories { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 28px; 
            overflow-x: auto; 
            width: 100%; 
            padding-bottom: 10px;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }
        
        .category-btn { 
            background-color: var(--card-bg); 
            color: var(--text-muted); 
            border: 1px solid var(--border-color); 
            padding: 10px 20px; 
            border-radius: 25px; 
            cursor: pointer; 
            white-space: nowrap; 
            font-size: 13px; 
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .category-btn:hover {
            color: var(--text-main);
            border-color: #444;
        }
        
        .category-btn.active { 
            background: var(--gold-gradient); 
            color: #000000; 
            border-color: transparent; 
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(170, 124, 17, 0.35);
        }
        
        .catalog { 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            width: 100%; 
        }
        
        .song-card { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 14px; 
            padding: 18px 22px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.4s ease forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .song-card:hover {
            background-color: var(--card-hover);
            border-color: #333336;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        
        .song-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: var(--gold-gradient);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .song-card:hover::before {
            opacity: 1;
        }
        
        .song-title { 
            font-size: 18px; 
            font-weight: 500; 
            letter-spacing: 0.3px;
            margin-bottom: 6px; 
            color: var(--text-main); 
        }
        
        .song-artist { 
            font-size: 14px; 
            color: var(--text-muted);
            letter-spacing: 0.2px;
        }
        
        .no-results { 
            text-align: center; 
            color: var(--text-muted); 
            margin-top: 40px; 
            font-size: 15px;
            display: none; 
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>MOSS</h1>
        <p>KARAOKE RESTAURANT • КАТАЛОГ ПІСЕНЬ</p>
    </header>

    <div id="statusMessage" class="status-msg">Завантаження каталогу треків...</div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="Пошук пісні або артиста..." disabled>
    </div>

    <div class="categories">
        <button class="category-btn active" onclick="filterCategory('all', this)">✨ Всі треки</button>
        <button class="category-btn" onclick="filterCategory('modern', this)">🔥 Сучасні хіти</button>
        <button class="category-btn" onclick="filterCategory('ua-top', this)">🇺🇦 UA Топ Хіти</button>
        <button class="category-btn" onclick="filterCategory('world', this)">🌍 Світові хіти</button>
        <button class="category-btn" onclick="filterCategory('classic', this)">🎵 UA Класика</button>
    </div>

    <div class="catalog" id="catalog"></div>
    <div class="no-results" id="noResults">Нічого не знайдено за вашим запитом</div>
</div>

<script>
    const jsonFiles = [
        'songs.json',
        'songs2.json',
        'songs3.json',
        'songs4.json'
    ];

    let allSongs = [];
    let currentCategory = 'all';
    
    const catalogDiv = document.getElementById('catalog');
    const searchInput = document.getElementById('searchInput');
    const noResults = document.getElementById('noResults');
    const statusMessage = document.getElementById('statusMessage');

    async function loadAllFiles() {
        const fetchPromises = jsonFiles.map(async (fileName) => {
            try {
                const response = await fetch(fileName + '?v=' + Date.now(), {
                    headers: { 'Cache-Control': 'no-cache' }
                });
                if (!response.ok) return [];
                
                const rawText = await response.text();
                const parsed = JSON.parse(rawText.trim());
                
                if (Array.isArray(parsed)) {
                    return parsed.map(song => {
                        if (fileName === 'songs4.json') {
                            song.isModern = true;
                        }
                        return song;
                    });
                }
                return [];
            } catch (error) {
                console.error('Помилка читання файлу ' + fileName + ':', error);
                return []; 
            }
        });

        const results = await Promise.all(fetchPromises);
        allSongs = results.flat();

        if (allSongs.length > 0) {
            statusMessage.style.display = 'none';
            searchInput.disabled = false;
            searchInput.placeholder = 'Пошук серед ' + allSongs.length + ' пісень...';
            renderSongs();
        } else {
            statusMessage.style.color = '#ff4444';
            statusMessage.innerHTML = 'Помилка завантаження бази даних.';
        }
    }

    function renderSongs() {
        const query = searchInput.value.toLowerCase().trim();
        let listHTML = '';
        let visibleCount = 0;

        for (let i = 0; i < allSongs.length; i++) {
            const song = allSongs[i];
            if (!song || !song.t || !song.a || !song.c) continue;

            const songTitleLower = song.t.toLowerCase();
            const songArtistLower = song.a.toLowerCase();
