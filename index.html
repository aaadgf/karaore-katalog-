<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOSS KARAOKE RESTAURANT</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --accent-gold: #c5a059;
            --text-main: #ffffff;
            --text-muted: #888888;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; }
        header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #222; }
        header h1 { font-size: 24px; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        header p { color: var(--text-muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        
        .search-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .search-box { width: 100%; padding: 15px; background-color: var(--card-bg); border: 1px solid #333; border-radius: 8px; color: var(--text-main); font-size: 16px; outline: none; }
        .search-box:focus { border-color: var(--accent-gold); }
        
        .author-select { width: 100%; padding: 12px; background-color: var(--card-bg); border: 1px solid #333; border-radius: 8px; color: var(--text-main); font-size: 15px; outline: none; cursor: pointer; }
        .author-select:focus { border-color: var(--accent-gold); }

        .categories { display: flex; gap: 10px; margin-bottom: 25px; overflow-x: auto; width: 100%; padding-bottom: 8px; }
        .category-btn { background-color: var(--card-bg); color: var(--text-main); border: 1px solid #333; padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 13px; transition: all 0.3s; }
        .category-btn.active { background-color: var(--accent-gold); color: #000; border-color: var(--accent-gold); font-weight: bold; }
        
        .catalog { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .song-card { background-color: var(--card-bg); border: 1px solid #222; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; }
        .song-title { font-size: 17px; font-weight: 600; margin-bottom: 4px; color: var(--text-main); }
        .song-artist { font-size: 14px; color: var(--text-muted); }
        .no-results { text-align: center; color: var(--text-muted); margin-top: 30px; display: none; }
        .loading { text-align: center; color: var(--accent-gold); margin-top: 20px; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>MOSS</h1>
        <p>KARAOKE RESTAURANT • КАТАЛОГ ПІСЕНЬ</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="Завантаження баз..." disabled>
        <select id="authorSelect" class="author-select" disabled>
            <option value="all">Всі автори (виконавці)</option>
        </select>
    </div>

    <div class="categories">
        <button class="category-btn active" onclick="filterCategory('all', this)">Всі треки</button>
        <button class="category-btn" onclick="filterCategory('ua-top', this)">UA Топ Хіти</button>
        <button class="category-btn" onclick="filterCategory('world', this)">Світові хіти</button>
        <button class="category-btn" onclick="filterCategory('classic', this)">UA Класика</button>
    </div>

    <div id="loadingStatus" class="loading">Очікування відповіді сервера...</div>
    <div class="catalog" id="catalog"></div>
    <div class="no-results" id="noResults">Нічого не знайдено за вашим запитом</div>
</div>

<script>
    let allSongs = [];
    let currentCategory = 'all';
    const catalogDiv = document.getElementById('catalog');
    const searchInput = document.getElementById('searchInput');
    const authorSelect = document.getElementById('authorSelect');
    const loadingStatus = document.getElementById('loadingStatus');
    const noResults = document.getElementById('noResults');

    // Додаємо випадкове число, щоб браузер телефону не брав старий зламаний файл із пам'яті (кешу)
    fetch('songs.json?v=' + Math.random())
        .then(response => {
            if (!response.ok) throw new Error('Помилка мережі');
            return response.json();
        })
        .then(data => {
            allSongs = data;
            loadingStatus.style.display = 'none';
            searchInput.disabled = false;
            authorSelect.disabled = false;
            searchInput.placeholder = `Пошук серед ${allSongs.length} пісень...`;
            
            buildAuthorFilter();
            renderSongs();

            searchInput.addEventListener('input', renderSongs);
            authorSelect.addEventListener('change', renderSongs);
        })
        .catch(err => {
            loadingStatus.innerHTML = '<span style="color:#ff4444;">Помилка! Перевірте структуру файлу songs.json</span>';
            console.error(err);
        });

    function buildAuthorFilter() {
        const authors = new Set();
        allSongs.forEach(song => {
            if(song.a) authors.add(song.a.trim());
        });
        
        const sortedAuthors = Array.from(authors).sort((a, b) => a.localeCompare(b, 'uk'));
        
        sortedAuthors.forEach(author => {
            const option = document.createElement('option');
            option.value = author.toLowerCase();
            option.textContent = author;
            authorSelect.appendChild(option);
        });
    }

    function renderSongs() {
        const query = searchInput.value.toLowerCase().trim();
        const selectedAuthor = authorSelect.value.toLowerCase();
        catalogDiv.innerHTML = '';
        let visibleCount = 0;

        for (let i = 0; i < allSongs.length; i++) {
            const song = allSongs[i];
            if (!song.t || !song.a) continue;

            const songTitleLower = song.t.toLowerCase();
            const songArtistLower = song.a.toLowerCase();
            
            const matchesSearch = query === '' || songTitleLower.includes(query) || songArtistLower.includes(query);
            const matchesCategory = currentCategory === 'all' || song.c === currentCategory;
            const matchesAuthor = selectedAuthor === 'all' || songArtistLower === selectedAuthor;

            if (matchesSearch && matchesCategory && matchesAuthor) {
                visibleCount++;
                
                // Виводимо перші 200 для швидкої роботи телефону
                if (visibleCount <= 200) {
                    const card = document.createElement('div');
                    card.className = 'song-card';
                    card.innerHTML = `<div class="song-title">${song.t}</div><div class="song-artist">${song.a}</div>`;
                    catalogDiv.appendChild(card);
                }
            }
        }

        noResults.style.display = visibleCount === 0 ? 'block' : 'none';
    }

    function filterCategory(category, buttonElement) {
        currentCategory = category;
        document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
        if (buttonElement) buttonElement.classList.add('active');
        renderSongs();
    }
</script>

</body>
</html>
