<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOSS KARAOKE RESTAURANT</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --accent-gold: #c5a059;
            --text-main: #ffffff;
            --text-muted: #888888;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; }
        header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #222; }
        header h1 { font-size: 24px; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        header p { color: var(--text-muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .search-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .search-box { width: 100%; padding: 15px; background-color: var(--card-bg); border: 1px solid #333; border-radius: 8px; color: var(--text-main); font-size: 16px; outline: none; }
        .search-box:focus { border-color: var(--accent-gold); }
        .categories { display: flex; gap: 10px; margin-bottom: 25px; overflow-x: auto; width: 100%; padding-bottom: 8px; }
        .category-btn { background-color: var(--card-bg); color: var(--text-main); border: 1px solid #333; padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 13px; transition: all 0.3s; }
        .category-btn.active { background-color: var(--accent-gold); color: #000; border-color: var(--accent-gold); font-weight: bold; }
        .catalog { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .song-card { background-color: var(--card-bg); border: 1px solid #222; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; }
        .song-title { font-size: 17px; font-weight: 600; margin-bottom: 4px; color: var(--text-main); }
        .song-artist { font-size: 14px; color: var(--text-muted); }
        .no-results { text-align: center; color: var(--text-muted); margin-top: 30px; display: none; }
        .status-msg { text-align: center; color: var(--accent-gold); margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>MOSS</h1>
        <p>KARAOKE RESTAURANT • КАТАЛОГ ПІСЕНЬ</p>
    </header>

    <div id="statusMessage" class="status-msg">Завантаження всієї бібліотеки треків...</div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="Пошук пісні або артиста..." disabled>
    </div>

    <div class="categories">
        <button class="category-btn active" onclick="filterCategory('all', this)">Всі треки</button>
        <button class="category-btn" onclick="filterCategory('ua-top', this)">UA Топ Хіти</button>
        <button class="category-btn" onclick="filterCategory('world', this)">Світові хіти</button>
        <button class="category-btn" onclick="filterCategory('classic', this)">UA Класика</button>
    </div>

    <div class="catalog" id="catalog"></div>
    <div class="no-results" id="noResults">Нічого не знайдено за вашим запитом</div>
</div>

<script>
    const jsonFiles = [
        'songs.json',
        'songs2.json',
        'songs3.json',
        'songs4.json'
    ];

    let allSongs = [];
    let currentCategory = 'all';
    
    const catalogDiv = document.getElementById('catalog');
    const searchInput = document.getElementById('searchInput');
    const noResults = document.getElementById('noResults');
    const statusMessage = document.getElementById('statusMessage');

    async function loadAllFiles() {
        const fetchPromises = jsonFiles.map(async (fileName) => {
            try {
                const response = await fetch(fileName + '?v=' + Date.now(), {
                    headers: { 'Cache-Control': 'no-cache' }
                });
                if (!response.ok) return [];
                const rawText = await response.text();
                const parsed = JSON.parse(rawText.trim());
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                console.error('Помилка читання файлу ' + fileName + ':', error);
                return []; 
            }
        });

        const results = await Promise.all(fetchPromises);
        allSongs = results.flat();

        if (allSongs.length > 0) {
            statusMessage.style.display = 'none';
            searchInput.disabled = false;
            searchInput.placeholder = 'Пошук серед ' + allSongs.length + ' пісень...';
            renderSongs();
        } else {
            statusMessage.style.color = '#ff4444';
            statusMessage.innerHTML = 'Помилка: не вдалося завантажити треки. Перевірте .json файли';
        }
    }

    function renderSongs() {
        const query = searchInput.value.toLowerCase().trim();
        let listHTML = '';
        let visibleCount = 0;

        for (let i = 0; i < allSongs.length; i++) {
            const song = allSongs[i];
            if (!song || !song.t || !song.a || !song.c) continue;

            const songTitleLower = song.t.toLowerCase();
            const songArtistLower = song.a.toLowerCase();
            
            const matchesSearch = query === '' || songTitleLower.indexOf(query) !== -1 || songArtistLower.indexOf(query) !== -1;
            const matchesCategory = currentCategory === 'all' || song.c === currentCategory;

            if (matchesSearch && matchesCategory) {
                visibleCount++;
                if (visibleCount <= 500) {
                    listHTML += '<div class="song-card"><div class="song-title">' + song.t + '</div><div class="song-artist">' + song.a + '</div></div>';
                }
            }
        }

        catalogDiv.innerHTML = listHTML;
        noResults.style.display = visibleCount === 0 ? 'block' : 'none';
    }

    function filterCategory(category, buttonElement) {
        currentCategory = category;
        const buttons = document.getElementsByClassName('category-btn');
        for(let i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove('active');
        }
        if (buttonElement) buttonElement.classList.add('active');
        renderSongs();
    }

    searchInput.addEventListener('input', renderSongs);
    loadAllFiles();
</script>

</body>
</html>
